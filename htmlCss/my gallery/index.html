<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
    </header>

    <main>
        <div class="gallery">
            <div class="card">
                <img src="birds.webp" alt="Birds">
                <p>birds</p>
            </div>
            
            <div class="card">
                <img src="travel.jpg" alt="Travel">
                <p>travel</p>
            </div>

            <div class="card">
                <img src="night rides.webp" alt="Night Rides">
                <p>night rides</p>
            </div>

            <div class="card">
                <img src="elephant.webp" alt="Animals">
                <p>animlas</p>
            </div>

            <div class="card">
                <img src="flowers.webp" alt="Flowers">
                <p>flowers</p>
            </div>

            <div class="card">
                <img src="shizuka.png" alt="Favourite Cartoon">
                <p>favourite cartoon</p>
            </div>

            <div class="card">
                <img src="hello.webp" alt="Movie">
                <p>movie</p>
            </div>

            <div class="card">
                <img src="festival fun.png" alt="Festival Fun">
                <p>Festival Fun</p>
            </div>
        </div>
    </main>

    <footer>
        <p>My everything</p>
    </footer>
</body>
</html>
